<div class="hotels-page">
  <div *ngIf="loading" class="state">
    <div class="skeleton-loader" aria-label="Cargando hoteles analizados">
      <div class="skeleton-line skeleton-line--title"></div>
      <div class="skeleton-grid">
        <div class="skeleton-card" *ngFor="let _ of [1, 2, 3]">
          <div class="skeleton-line skeleton-line--short"></div>
          <div class="skeleton-line skeleton-line--value"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line skeleton-line--long"></div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && errorMsg" class="state error">
    <strong>Error:</strong> {{ errorMsg }}
  </div>

  <section class="section" *ngIf="!loading">
    <div class="hero-copy">
      <h2 class="section-title">Selecciona un hotel</h2>
    </div>

    <div class="hotel-grid" *ngIf="hotels.length; else noHotels">
      <article class="hotel-card" *ngFor="let h of hotels; trackBy: trackByHotelName">
        <div class="hotel-card-header">
          <h3 class="hotel-name">{{ h.hotel_display_name }}</h3>

          <ng-container *ngIf="getBadgeForHotel(h.hotel_name) as b">
            <div class="badge-pill" [attr.data-tone]="b.tone">{{ b.pct }}% {{ b.label }}</div>
          </ng-container>
        </div>

        <div class="hotel-meta">
          <div class="meta-line" *ngIf="h.address">
            <span class="meta-icon" aria-hidden="true">
              <img src="assets/location-home.png" alt="Ubicación" width="14" height="14" />
            </span>
            <span class="meta-text">{{ h.address }}</span>
          </div>

          <div class="meta-stats">
            <div class="meta-inline">
              <span class="meta-icon" aria-hidden="true">
                <img src="assets/stars-home.png" alt="Estrellas" width="14" height="14" />
              </span>
              <span class="meta-strong">{{ h.avg_star_rating_hotel | number:'1.1-2' }}/5</span>
            </div>

            <div class="meta-inline">
              <span class="meta-icon" aria-hidden="true">
                <img src="assets/users-home.png" alt="Usuarios" width="14" height="14" />
              </span>
              <span class="meta-muted">{{ h.total_reviews_hotel | number }} reseñas</span>
            </div>
          </div>
        </div>

        <div class="kw-title">
          <span class="kw-icon" aria-hidden="true">
            <img src="assets/trending-home.png" alt="" width="22" height="22" />
          </span>
          Temáticas más discutidas:
        </div>
        

        <ng-container *ngIf="asChips(h.top_words, 6) as c">
          <div class="chips" *ngIf="c.items.length">
            <span class="chip" *ngFor="let w of c.items">{{ w }}</span>
          </div>
        </ng-container>

        
        <a class="btn-primary" [routerLink]="['/register']" [queryParams]="{ redirect: '/hotels/' + h.hotel_name }">Ver más detalles</a>

    <ng-template #noHotels>
      <div class="state muted">No hay datos para mostrar.</div>
    </ng-template>
  </section>
</div>
