<section class="page">
  <header class="header">
    <h1>Inicio</h1>
    <p>Resumen general del análisis de opiniones hoteleras</p>
  </header>

  <div class="kpis">
    <div class="kpi-card">
      <span class="kpi-label">Total reseñas</span>
      <div class="kpi-value skeleton"></div>
    </div>

    <div class="kpi-card">
      <span class="kpi-label">Puntuación promedio</span>
      <div class="kpi-value skeleton"></div>
    </div>

    <div class="kpi-card">
      <span class="kpi-label">Tasa de satisfacción</span>
      <div class="kpi-value skeleton"></div>
    </div>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2>Distribución de sentimientos por hotel</h2>
      <span class="hint">Placeholder (conectaremos Supabase luego)</span>
    </div>
    <div class="chart-placeholder skeleton"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Hoteles analizados</h2>
      <a routerLink="/hotels" class="link">Ver detalle</a>
    </div>

    <div class="hotels-grid">
      <article class="hotel-card" *ngFor="let _ of hotelsMock">
        <div class="hotel-top">
          <div class="hotel-name skeleton"></div>
          <div class="badge skeleton"></div>
        </div>

        <div class="hotel-row">
          <span class="muted">Reseñas</span>
          <span class="skeleton small"></span>
        </div>

        <div class="hotel-row">
          <span class="muted">Satisfacción</span>
          <span class="skeleton small"></span>
        </div>

        <div class="tags">
          <span class="tag skeleton"></span>
          <span class="tag skeleton"></span>
          <span class="tag skeleton"></span>
        </div>
      </article>
    </div>
  </section>
</section>
