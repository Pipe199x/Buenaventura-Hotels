<div class="auth-page">
  <header class="auth-header">
    <h1>Opinión Hotelera Buenaventura</h1>
    <p>Accede a tu análisis de opiniones hoteleras</p>
  </header>

  <section class="card">
    <h2>Iniciar Sesión</h2>

    <label class="label">Correo electrónico</label>
    <div class="input-wrap">
      <input [(ngModel)]="email" type="email" placeholder="ejemplo@correo.com" />
    </div>

    <label class="label">Contraseña</label>
    <div class="input-wrap">
      <input
        [(ngModel)]="password"
        [type]="showPassword ? 'text' : 'password'"
        placeholder="••••••••"
      />
      <button type="button" class="icon-btn" (click)="showPassword = !showPassword">
        {{ showPassword ? '🙈' : '👁' }}
      </button>
    </div>

    <button class="btn primary" (click)="loginEmail()">Iniciar sesión</button>

    <div class="divider"><span>o</span></div>

    <button class="btn ghost google" (click)="loginGoogle()">
      <img class="google-icon" src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" />
      <span>Registrarse con Google</span>
    </button>

    <p class="foot">
      ¿No tienes cuenta?
      <a routerLink="/register">Regístrate</a>
    </p>
  </section>
</div>
