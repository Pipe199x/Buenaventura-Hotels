<div class="auth-page">
  <header class="auth-header">
    <h1>{{ 'APP.TITLE' | translate }}</h1>
    <p>{{ 'APP.SUBTITLE' | translate }}</p>
  </header>

  <section class="card">
    <h2>{{ 'AUTH.LOGIN_TITLE' | translate }}</h2>

    <label class="label">{{ 'AUTH.EMAIL' | translate }}</label>
    <div class="input-wrap">
      <span class="icon">✉</span>
      <input
        [(ngModel)]="email"
        type="email"
        [placeholder]="'AUTH.EMAIL_PLACEHOLDER' | translate"
        autocomplete="email"
      />
    </div>

    <label class="label">{{ 'AUTH.PASSWORD' | translate }}</label>
    <div class="input-wrap">
      <span class="icon">🔒</span>
      <input
        [(ngModel)]="password"
        [type]="showPassword ? 'text' : 'password'"
        [placeholder]="'AUTH.PASSWORD_PLACEHOLDER' | translate"
        autocomplete="current-password"
      />
      <button
        type="button"
        class="icon-btn"
        (click)="showPassword = !showPassword"
        [attr.aria-label]="'AUTH.TOGGLE_PASSWORD' | translate"
      >
        {{ showPassword ? '🙈' : '👁' }}
      </button>
    </div>

    <button class="btn primary" (click)="loginEmail()" [disabled]="loading">
      {{ loading ? ('AUTH.WAIT' | translate) : ('AUTH.LOGIN_BUTTON' | translate) }}
    </button>

    <div class="divider">
      <span>{{ 'AUTH.OR' | translate }}</span>
    </div>

    <button class="btn ghost google" (click)="loginGoogle()" [disabled]="loading">
      <img
        class="google-icon"
        src="assets/icons/google.svg"
        alt="Google"
      />
      <span>{{ 'AUTH.CONTINUE_GOOGLE' | translate }}</span>
    </button>

    <p class="foot">
      {{ 'AUTH.NO_ACCOUNT' | translate }}
      <a routerLink="/register">{{ 'AUTH.SIGN_UP' | translate }}</a>
    </p>
  </section>
</div>
