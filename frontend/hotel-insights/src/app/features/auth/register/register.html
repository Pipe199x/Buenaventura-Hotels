<div class="auth-page">
  <header class="auth-header">
    <h1>Opinión Hotelera Buenaventura</h1>
    <p>Regístrate para acceder al dashboard</p>
  </header>

  <section class="card">
    <h2>Crear Cuenta</h2>

    <label class="label">Correo electrónico</label>
    <div class="input-wrap">
      <input [(ngModel)]="email" type="email" placeholder="ejemplo@correo.com" />
    </div>

    <label class="label">Contraseña</label>
    <div class="input-wrap">
      <input [(ngModel)]="password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" />
      <button type="button" class="icon-btn" (click)="showPassword = !showPassword">
        {{ showPassword ? '🙈' : '👁' }}
      </button>
    </div>

    <label class="label">Confirmar contraseña</label>
    <div class="input-wrap">
      <input [(ngModel)]="confirmPassword" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" />
    </div>

    <button class="btn primary" (click)="register()">Registrarse</button>

    <div class="divider">
      <span>o</span>
    </div>

    <button class="btn ghost google" (click)="registerGoogle()">
      <img
         class="google-icon"
         src="https://www.svgrepo.com/show/475656/google-color.svg"
         alt="Google"
      />
      <span>Continuar con Google</span>
    </button>



    <p class="foot">
      ¿Ya tienes cuenta?
      <a [routerLink]="['/login']" [queryParams]="{ redirect: redirectUrl }">Inicia sesión</a>
    </p>
  </section>
</div>
