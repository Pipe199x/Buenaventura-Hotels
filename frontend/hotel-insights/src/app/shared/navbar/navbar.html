<nav class="nav">
  <a routerLink="/" routerLinkActive="active">{{ 'NAV.HOME' | translate }}</a>
  <a routerLink="/hotels" routerLinkActive="active">{{ 'NAV.HOTELS' | translate }}</a>
  <a routerLink="/about" routerLinkActive="active">{{ 'NAV.ABOUT' | translate }}</a>

  <div class="spacer"></div>

  <select [value]="currentLang" (change)="setLang(($any($event.target).value))">
    <option value="es">Español</option>
    <option value="en">English</option>
  </select>

  <button class="logout" (click)="logout()">
    {{ 'NAV.LOGOUT' | translate }}
  </button>
</nav>
