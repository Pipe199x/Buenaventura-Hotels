<nav class="nav">
  <div class="left">
    <a class="brand" routerLink="/">Opinión Hotelera</a>

    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/hotels" routerLinkActive="active">Hoteles</a>
    <a routerLink="/about" routerLinkActive="active">Acerca de</a>
  </div>

  <div class="right">
    <ng-container *ngIf="(session$ | async) as session; else loggedOut">
      <button class="btn" (click)="logout()">Salir</button>
    </ng-container>

    <ng-template #loggedOut>
      <a class="btn" routerLink="/login">Iniciar sesión</a>
    </ng-template>
  </div>
</nav>
