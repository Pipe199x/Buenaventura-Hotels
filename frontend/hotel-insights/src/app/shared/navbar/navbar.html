<header class="nav">
  <div class="nav-inner">
    <!-- Brand (izquierda) -->
    <a class="brand" routerLink="/" aria-label="Ir a Inicio">
      Opinión Hotelera
    </a>

    <!-- Links (centrados) -->
    <nav class="links" aria-label="Navegación principal">
      <a
        class="link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="icon" aria-hidden="true">
          <img src="assets/nav-home.png" alt="Inicio" width="18" height="18" />
        </span>
        <span class="label">Inicio</span>
      </a>

      <a class="link" routerLink="/hotels" routerLinkActive="active">
        <span class="icon" aria-hidden="true">
          <img src="assets/nav-hotel.png" alt="Hoteles" width="18" height="18" />
        </span>
        <span class="label">Hoteles</span>
      </a>

      <a class="link" routerLink="/about" routerLinkActive="active">
        <span class="icon" aria-hidden="true">
          <img src="assets/nav-info.png" alt="Acerca de" width="18" height="18" />
        </span>
        <span class="label">Acerca de</span>
      </a>
    </nav>

    <!-- Auth action (derecha) -->
    @if (session$ | async) {
      <button class="logout" type="button" (click)="logout()">
        <span class="icon" aria-hidden="true">
          <img src="assets/nav-logout.png" alt="" width="18" height="18" />
        </span>
        <span class="label">Salir</span>
      </button>
    } @else {
      <button class="logout" type="button" (click)="openLogin()">
        <span class="label">Iniciar sesión</span>
      </button>
    }
  </div>
</header>
