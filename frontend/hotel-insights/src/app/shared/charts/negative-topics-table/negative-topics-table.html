<div class="table-container">

  <!-- Header -->
  <div class="table-header">
    <h3 class="title">Patrones negativos identificados</h3>
    <p class="subtitle">
      Frecuencia por año
      ({{ visibleYears[0]?.label }} – {{ visibleYears[visibleYears.length - 1]?.label }})
    </p>
  </div>

  <!-- Table -->
  <div class="table-scroll">
    <table class="topics-table">

      <!-- Table Head -->
      <thead>
        <tr>
          <th class="col-topic">Patrón</th>

          <!-- 🔥 Dynamic years -->
          <th *ngFor="let year of visibleYears">
            {{ year.label }}
          </th>
        </tr>
      </thead>

      <!-- Table Body -->
      <tbody>
        <tr *ngFor="let row of rows">

          <!-- Topic -->
          <td class="topic">
            {{ row.thematic_label }}
          </td>

          <!-- 🔥 Dynamic values -->
          <td *ngFor="let year of visibleYears">
            <span
              class="cell-badge"
              [ngClass]="getIntensityClass(row[year.key], row)">
              {{ row[year.key] }}
            </span>
          </td>

        </tr>
      </tbody>

    </table>
  </div>

</div>
