<div class="table-container">

  <!-- Header -->
  <div class="table-header">
    <h3 class="title">Patrones negativos identificados</h3>
    <p class="subtitle">Frecuencia por año (2020 – 2025)</p>
  </div>

  <!-- Table -->
  <div class="table-scroll">
    <table class="topics-table">

      <!-- Table Head -->
      <thead>
        <tr>
          <th class="col-topic">Patrón</th>
          <th>2020</th>
          <th>2021</th>
          <th>2022</th>
          <th>2023</th>
          <th>2024</th>
          <th>2025</th>
        </tr>
      </thead>

      <!-- Table Body -->
      <tbody>
        <tr *ngFor="let row of rows">

          <!-- Topic -->
          <td class="topic">
            {{ row.thematic_label }}
          </td>

          <!-- Years -->
          <td>
            <span
              class="cell-badge"
              [class.active]="row.y2020 > 0">
              {{ row.y2020 }}
            </span>
          </td>

          <td>
            <span
              class="cell-badge"
              [class.active]="row.y2021 > 0">
              {{ row.y2021 }}
            </span>
          </td>

          <td>
            <span
              class="cell-badge"
              [class.active]="row.y2022 > 0">
              {{ row.y2022 }}
            </span>
          </td>

          <td>
            <span
              class="cell-badge"
              [class.active]="row.y2023 > 0">
              {{ row.y2023 }}
            </span>
          </td>

          <td>
            <span
              class="cell-badge"
              [class.active]="row.y2024 > 0">
              {{ row.y2024 }}
            </span>
          </td>

          <td>
            <span
              class="cell-badge"
              [class.active]="row.y2025 > 0">
              {{ row.y2025 }}
            </span>
          </td>

        </tr>
      </tbody>

    </table>
  </div>

</div>
